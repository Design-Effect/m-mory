<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FCF6F9">
<title>Memory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FCF6F9;
    --ink: #3A2E4F;
    --ink-soft: #7A6E8F;
    --amber: #6F5BA8;
    --amber-deep: #57468A;
    --listen-bg: #FFD84D;
    --listen-ink: #4A3600;
    --card: #FFFFFF;
    --card-border: #EBD9E6;
    --danger: #C1121F;
    --ok: #2D6A4F;
    --radius: 28px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    background: var(--paper);
    background-image: radial-gradient(circle at 20% 0%, #F3E8F6 0%, transparent 55%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    transition: background-color .35s ease;
  }
  body.listening {
    background: var(--listen-bg);
    background-image: none;
    color: var(--listen-ink);
  }

  header {
    width: 100%;
    max-width: 640px;
    padding: 20px 22px 4px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #clock {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  body.listening #clock { color: var(--listen-ink); }

  main {
    width: 100%;
    max-width: 640px;
    padding: 10px 18px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  /* ---------- GROS BOUTON ---------- */
  #bigBtn {
    width: min(78vw, 320px);
    height: min(78vw, 320px);
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #8A79C9, var(--amber) 60%, var(--amber-deep));
    color: #fff;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    box-shadow: 0 14px 40px rgba(87, 70, 138, .35), inset 0 -6px 14px rgba(0,0,0,.18);
    margin: 22px 0 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    touch-action: manipulation;
    user-select: none;
    transition: transform .1s ease;
  }
  #bigBtn:active { transform: scale(.96); }
  #bigBtn .mic { font-size: 3.4rem; }

  body.listening #bigBtn {
    background: radial-gradient(circle at 35% 30%, #6B4E00, var(--listen-ink));
    animation: pulse 1.4s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(74, 54, 0, .45);
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74, 54, 0, .45); }
    70%  { box-shadow: 0 0 0 34px rgba(74, 54, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(74, 54, 0, 0); }
  }

  #status {
    min-height: 3.2em;
    font-size: 1.35rem;
    font-weight: 700;
    text-align: center;
    padding: 0 10px;
  }
  #interim {
    min-height: 1.6em;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--ink-soft);
    text-align: center;
    padding: 0 14px;
    max-width: 100%;
    overflow-wrap: break-word;
  }
  body.listening #interim { color: #6B4E00; }

  /* ---------- TOOLBAR ---------- */
  .toolbar {
    width: 100%;
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }
  .tool {
    flex: 1;
    border: none;
    border-radius: 22px;
    background: #EFE7F5;
    color: var(--ink);
    font-family: inherit;
    font-size: 1.22rem;
    font-weight: 700;
    padding: 18px 10px;
    min-height: 64px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tool:active { background: #E2D5EE; }

  #filterBar {
    display: none;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #FBE9EF;
    border: 2px solid #E0788F;
    border-radius: 20px;
    padding: 12px 16px;
    margin-top: 18px;
    font-size: 1.15rem;
    font-weight: 700;
  }
  #filterBar.on { display: flex; }
  #clearFilter {
    border: none;
    border-radius: 14px;
    background: var(--ink);
    color: #fff;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 12px 16px;
    min-height: 50px;
    cursor: pointer;
  }

  .dayHeader {
    font-family: 'Fraunces', serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--amber-deep);
    margin: 10px 0 -2px;
    padding-left: 6px;
  }

  /* ---------- LISTE DES NOTES ---------- */
  #notesTitle {
    font-family: 'Fraunces', serif;
    font-size: 1.35rem;
    font-weight: 600;
    align-self: flex-start;
    margin: 30px 0 12px;
    border-bottom: 3px solid #E0788F;
    padding-bottom: 4px;
  }
  #notes { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .note {
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px 18px 14px;
    box-shadow: 0 3px 10px rgba(87, 70, 138, .08);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .note .txt {
    font-size: 1.3rem;
    line-height: 1.45;
    overflow-wrap: break-word;
  }
  .note .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .note .when {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .note button {
    border: none;
    border-radius: 18px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 14px 18px;
    cursor: pointer;
    min-height: 54px;
    touch-action: manipulation;
  }
  .note .play {
    flex: 1;
    background: var(--ink);
    color: var(--paper);
  }
  .note .play:active { background: #000; }
  .note .del {
    background: #F6E7E7;
    color: var(--danger);
    min-width: 64px;
  }
  .actions { display: flex; gap: 10px; }

  #empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 1.2rem;
    padding: 26px 10px;
    line-height: 1.5;
  }

  /* ---------- OVERLAY SUPPRESSION ---------- */
  #delOverlay {
    position: fixed;
    inset: 0;
    background: rgba(58, 46, 79, .93);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 26px;
    z-index: 50;
    color: #fff;
    text-align: center;
  }
  #delOverlay.open { display: flex; }
  #delOverlay h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.9rem;
  }
  #delPreview {
    font-size: 1.2rem;
    font-style: italic;
    max-width: 460px;
    max-height: 6em;
    overflow: hidden;
    opacity: .85;
  }
  #holdDel {
    position: relative;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    border: none;
    background: var(--danger);
    color: #fff;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.3;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    overflow: hidden;
  }
  #holdDel .fill {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.28);
    transform: scaleY(0);
    transform-origin: bottom;
  }
  #holdDel.holding .fill {
    transition: transform 3s linear;
    transform: scaleY(1);
  }
  #holdDel span { position: relative; z-index: 1; }
  #cancelDel {
    background: #fff;
    color: var(--ink);
    border: none;
    border-radius: 22px;
    font-family: inherit;
    font-size: 1.4rem;
    font-weight: 700;
    padding: 20px 46px;
    min-height: 66px;
    cursor: pointer;
  }

  #noSupport {
    display: none;
    background: #F6E7E7;
    color: var(--danger);
    border-radius: var(--radius);
    padding: 18px;
    font-size: 1.15rem;
    line-height: 1.5;
    margin-top: 18px;
  }
</style>
</head>
<body>

<header>
  <h1>Memory</h1>
  <div id="clock"></div>
</header>

<main>
  <button id="bigBtn" aria-label="Démarrer ou arrêter l'enregistrement">
    <span class="mic">🎙️</span>
    <span id="btnLabel">Appuie et parle</span>
  </button>
  <div id="status">Prêt.</div>
  <div id="interim"></div>
  <div id="noSupport">
    Ce navigateur ne gère pas la reconnaissance vocale.<br>
    Ouvre Memory dans <strong>Google Chrome</strong>.
  </div>

  <div class="toolbar">
    <button id="todayBtn" class="tool">📖 Ma journée</button>
    <button id="searchBtn" class="tool">🔍 Chercher</button>
  </div>

  <div id="filterBar">
    <span id="filterLabel"></span>
    <button id="clearFilter">Tout afficher</button>
  </div>

  <div id="notesTitle">Mes notes</div>
  <div id="notes"></div>
  <div id="empty">Aucune note pour l'instant.<br>Appuie sur le gros bouton et parle.</div>
</main>

<div id="delOverlay">
  <h2>Supprimer cette note ?</h2>
  <div id="delPreview"></div>
  <button id="holdDel">
    <div class="fill"></div>
    <span>Maintiens 3 secondes<br>pour supprimer</span>
  </button>
  <button id="cancelDel">Non, je la garde</button>
</div>

<script>
/* =========================================================
   MÉMO VOCAL — v1
   Capture vocale continue + relecture + suppression sécurisée
   Stockage : localStorage (clé mv_notes)
   ========================================================= */

const STORE_KEY = 'mv_notes';
const STOP_PHRASES = ['terminé mémo', 'termine mémo', 'terminé memo', 'fin de note'];
const SILENCE_LIMIT_MS = 60000;

const $ = id => document.getElementById(id);
const bigBtn = $('bigBtn'), btnLabel = $('btnLabel'), statusEl = $('status'),
      interimEl = $('interim'), notesEl = $('notes'), emptyEl = $('empty');

/* ---------- Notes : stockage ---------- */
function loadNotes() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}
function saveNotes(notes) {
  localStorage.setItem(STORE_KEY, JSON.stringify(notes));
}
function addNote(text) {
  const notes = loadNotes();
  notes.unshift({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), text, ts: Date.now() });
  saveNotes(notes);
  renderNotes();
}
function deleteNote(id) {
  saveNotes(loadNotes().filter(n => n.id !== id));
  renderNotes();
}

/* ---------- Affichage ---------- */
function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  const day0 = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = (day0(now) - day0(d)) / 86400000;
  if (diff === 0) return 'Aujourd\u2019hui';
  if (diff === 1) return 'Hier';
  return d.toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long' });
}
function timeLabel(ts) {
  return new Date(ts).toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
}
function fmtWhen(ts) {
  return dayLabel(ts).toLowerCase() === 'aujourd\u2019hui'
    ? 'aujourd\u2019hui à ' + timeLabel(ts)
    : dayLabel(ts) + ' à ' + timeLabel(ts);
}
function spokenTime(ts) {
  const d = new Date(ts), h = d.getHours(), m = d.getMinutes();
  return h + ' heure' + (h > 1 ? 's' : '') + (m ? ' ' + m : '');
}

let activeFilter = null;

function renderNotes() {
  const all = loadNotes();
  const notes = activeFilter
    ? all.filter(n => n.text.toLowerCase().includes(activeFilter))
    : all;
  emptyEl.style.display = notes.length ? 'none' : 'block';
  emptyEl.innerHTML = activeFilter
    ? 'Aucune note avec «\u00A0' + activeFilter + '\u00A0».'
    : 'Aucune note pour l\u2019instant.<br>Appuie sur le gros bouton et parle.';
  notesEl.innerHTML = '';
  let lastDay = null;
  for (const n of notes) {
    const dl = dayLabel(n.ts);
    if (dl !== lastDay) {
      lastDay = dl;
      const h = document.createElement('div');
      h.className = 'dayHeader';
      h.textContent = dl;
      notesEl.append(h);
    }
    const card = document.createElement('div');
    card.className = 'note';
    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = n.text;
    const meta = document.createElement('div');
    meta.className = 'when';
    meta.textContent = timeLabel(n.ts);
    const actions = document.createElement('div');
    actions.className = 'actions';
    const play = document.createElement('button');
    play.className = 'play';
    play.textContent = '🔊 Écouter';
    play.onclick = () => speak(n.text + '. Enregistrée ' + fmtWhen(n.ts) + '.');
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '🗑️';
    del.setAttribute('aria-label', 'Supprimer');
    del.onclick = () => openDelete(n);
    actions.append(play, del);
    card.append(txt, meta, actions);
    notesEl.append(card);
  }
}

/* ---------- Synthèse vocale ---------- */
const TTS = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let frVoice = null;
function pickVoice() {
  if (!TTS) return;
  const vs = TTS.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
  const score = v => {
    const n = (v.name || '').toLowerCase();
    let s = 0;
    if (n.includes('natural') || n.includes('neural') || n.includes('enhanced') || n.includes('premium')) s += 40;
    if (n.includes('google')) s += 30;
    if (v.lang === 'fr-FR') s += 20;       // en général les moins robotiques
    if (v.localService === false) s += 10; // voix réseau = souvent meilleure qualité
    return s;
  };
  frVoice = vs.sort((a, b) => score(b) - score(a))[0] || null;
}
if (TTS) TTS.onvoiceschanged = pickVoice;
pickVoice();

let speakSeq = 0;          // identifiant de la dernière utterance demandée
let speakingText = null;   // texte actuellement en cours de synthèse

function speak(text, onDone) {
  if (!TTS) { if (onDone) onDone(); return; }
  // Anti-boucle : si exactement ce texte est déjà en train d'être dit, on ignore
  if (speakingText === text && TTS.speaking) return;

  // On coupe le micro pendant que l'app parle pour ne pas s'auto-transcrire
  pauseRecognition();
  const myId = ++speakSeq;
  speakingText = text;
  TTS.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  if (frVoice) u.voice = frVoice;
  u.rate = 0.95;
  u.onend = u.onerror = () => {
    // Seule la DERNIÈRE utterance a le droit de relancer le micro.
    // (le cancel() d'une ancienne déclenche son onerror : on l'ignore)
    if (myId !== speakSeq) return;
    speakingText = null;
    if (onDone) onDone();
    resumeRecognitionIfSession();
  };
  TTS.speak(u);
}

/* ---------- Sons courts (début / fin) ---------- */
function beep(freq, ms) {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms / 1000);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + ms / 1000);
  } catch (e) { console.error(e); }
}

/* ---------- Reconnaissance vocale ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let session = false;        // une session d'écoute est en cours
let recPaused = false;      // micro suspendu pendant le TTS
let silenceTimer = null;
let sessionParts = [];      // segments validés (commandes d'effacement déjà appliquées)
let cycleFinals = [];       // segments finalisés bruts du cycle de reco EN COURS
let wakeLock = null;

/* Commandes d'édition vocales pendant la session */
const ERASE_LAST = ['efface ça', 'efface sa', 'annule ça', 'annule sa'];
const ERASE_ALL  = ['efface tout', 'on recommence', 'recommence la note'];

function findCmd(lower) {
  // Première commande rencontrée dans le texte (position + type + longueur)
  let best = null;
  for (const p of ERASE_ALL) {
    const i = lower.indexOf(p);
    if (i !== -1 && (!best || i < best.i)) best = { i, len: p.length, all: true };
  }
  for (const p of ERASE_LAST) {
    const i = lower.indexOf(p);
    if (i !== -1 && (!best || i < best.i)) best = { i, len: p.length, all: false };
  }
  return best;
}

function applyEdits(baseParts, newFinals) {
  // Rejoué à l'identique à chaque reconstruction du cycle → résultat stable.
  const parts = [...baseParts];
  for (const raw of newFinals) {
    let txt = raw;
    let cmd;
    while ((cmd = findCmd(txt.toLowerCase()))) {
      const before = txt.slice(0, cmd.i).trim();
      if (cmd.all) parts.length = 0;            // « efface tout » : on repart de zéro
      else if (before) { /* « bla bla efface ça » : le bla bla est jeté */ }
      else parts.pop();                          // « efface ça » seul : retire le dernier segment
      txt = txt.slice(cmd.i + cmd.len);
    }
    if (txt.trim()) parts.push(txt.trim());
  }
  return parts;
}

function currentParts() {
  return applyEdits(sessionParts, cycleFinals);
}
function mergedText() {
  return currentParts().join(' ').trim();
}
function commitCycle() {
  // Un cycle de reco se termine : on fige son texte (édité) dans le buffer global.
  sessionParts = currentParts();
  cycleFinals = [];
}
function showBuffer() {
  const t = mergedText();
  statusEl.textContent = t.length > 140 ? '… ' + t.slice(-140) : (t || 'Parle, je note tout.');
}

if (!SR) {
  $('noSupport').style.display = 'block';
  bigBtn.disabled = true;
  bigBtn.style.opacity = .4;
}

function resetSilenceTimer() {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(() => endSession('silence'), SILENCE_LIMIT_MS);
}

function containsStop(text) {
  const t = text.toLowerCase();
  return STOP_PHRASES.some(p => t.includes(p));
}

/* Commandes d'action pendant la session :
   « lis ma journée » → lecture du jour ; « cherche le mot X » → recherche de X */
const TODAY_PHRASES = ['lis ma journée', 'lit ma journée', 'lis moi ma journée', 'lis-moi ma journée'];
function findAction(text) {
  const l = text.toLowerCase();
  for (const p of TODAY_PHRASES) {
    const i = l.indexOf(p);
    if (i !== -1) return { kind: 'today', i };
  }
  const m = l.match(/cherche le mot\s+(.+)$/);
  if (m && m[1].trim()) return { kind: 'search', i: m.index, word: m[1].trim() };
  return null;
}
function stripStop(text) {
  let t = text;
  for (const p of STOP_PHRASES) {
    const i = t.toLowerCase().indexOf(p);
    if (i !== -1) t = t.slice(0, i);
  }
  return t.trim();
}

function makeRecognizer() {
  const r = new SR();
  r.lang = 'fr-FR';
  r.continuous = true;
  r.interimResults = true;
  r.onresult = e => {
    // ANDROID FIX : Chrome relivre les mêmes segments plusieurs fois
    // (en versions qui grandissent). On ne concatène donc JAMAIS
    // événement par événement : on RECONSTRUIT tout le texte du cycle
    // depuis e.results, avec déduplication.
    const finals = [];
    let interim = '';
    for (let i = 0; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim();
      if (!t) continue;
      if (e.results[i].isFinal) {
        const last = finals[finals.length - 1];
        if (last === t) continue;                       // doublon exact
        if (last && t.startsWith(last)) finals[finals.length - 1] = t;  // version étendue du même segment
        else if (last && last.endsWith(t)) continue;    // sous-partie déjà couverte
        else finals.push(t);
      } else {
        interim += (interim ? ' ' : '') + t;
      }
    }
    const newCycle = finals.join(' ');
    if (newCycle !== cycleFinals.join(' ')) {
      // Bip grave si une NOUVELLE commande d'effacement vient d'être captée
      const countCmds = s => {
        const l = s.toLowerCase();
        return [...ERASE_LAST, ...ERASE_ALL].reduce((n, p) => n + l.split(p).length - 1, 0);
      };
      const hadCmds = countCmds(cycleFinals.join(' '));
      cycleFinals = finals;
      if (countCmds(newCycle) > hadCmds) beep(300, 180);
      else beep(1200, 60);
    }
    // Détection du mot de fin (dans le finalisé OU l'interim)
    if (containsStop(mergedText() + ' ' + interim)) {
      const tail = stripStop(interim);
      if (tail) cycleFinals.push(tail); // ne pas perdre les derniers mots
      endSession('voice');
      return;
    }
    // Commandes d'action vocales (détectées dans le finalisé uniquement,
    // pour ne pas déclencher sur une phrase à moitié entendue)
    const cycleJoined = cycleFinals.join(' ');
    const act = findAction(cycleJoined);
    if (act) {
      // On garde ce qui a été dit AVANT la commande comme note éventuelle
      const before = cycleJoined.slice(0, act.i).trim();
      cycleFinals = before ? [before] : [];
      endSession('voice', true); // fin silencieuse : on enchaîne sur l'action
      setTimeout(() => act.kind === 'today' ? readToday() : runSearch(act.word), 250);
      return;
    }
    interimEl.textContent = interim ? '« ' + interim + ' »' : '';
    showBuffer();
    resetSilenceTimer();
  };
  r.onend = () => {
    // Fin d'un cycle de reco : on fige son texte, puis on relance si besoin.
    commitCycle();
    if (session && !recPaused) {
      setTimeout(() => {
        if (!session || recPaused) return;
        try { r.start(); }
        catch (e1) {
          try { rec = makeRecognizer(); rec.start(); }
          catch (e2) { console.error(e2); }
        }
      }, 120);
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      endSession('error');
      statusEl.textContent = 'Micro refusé. Autorise le micro dans Chrome.';
    }
  };
  return r;
}

function pauseRecognition() {
  if (rec && session) {
    recPaused = true;
    try { rec.stop(); } catch (e) {}
  }
}
function resumeRecognitionIfSession() {
  if (session && recPaused) {
    recPaused = false;
    try { rec.start(); } catch (e) {}
  }
}

async function startSession() {
  session = true;
  sessionParts = [];
  cycleFinals = [];
  recPaused = false;
  document.body.classList.add('listening');
  btnLabel.textContent = 'J\u2019écoute…\n(appuie pour arrêter)';
  statusEl.textContent = 'Parle, je note tout. Dis « terminé mémo » pour arrêter.';
  beep(880, 150);
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { console.error(e); }
  rec = makeRecognizer();
  speak('Je t\u2019écoute.', () => resetSilenceTimer());
}

function endSession(reason, silent) {
  if (!session) return;
  session = false;
  clearTimeout(silenceTimer);
  recPaused = false;
  if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  document.body.classList.remove('listening');
  btnLabel.textContent = 'Appuie et parle';
  interimEl.textContent = '';
  beep(440, 200);
  // Figer le cycle en cours, puis tout ce qui a été dit devient UNE note.
  commitCycle();
  const text = stripStop(sessionParts.join(' ')).trim();
  sessionParts = [];
  cycleFinals = [];
  let msg;
  if (text) {
    addNote(text);
    msg = 'Ta note est enregistrée.';
  } else {
    msg = 'Session terminée. Aucune note.';
  }
  statusEl.textContent = msg;
  if (reason !== 'error' && !silent && TTS) {
    TTS.cancel();
    const u = new SpeechSynthesisUtterance(msg);
    u.lang = 'fr-FR';
    if (frVoice) u.voice = frVoice;
    TTS.speak(u);
  }
}

bigBtn.onclick = () => {
  if (!SR) return;
  session ? endSession('tap') : startSession();
};

/* ---------- Suppression sécurisée (maintien 3 s) ---------- */
const delOverlay = $('delOverlay'), holdDel = $('holdDel'), cancelDel = $('cancelDel');
let delTarget = null, holdTimer = null;

function openDelete(note) {
  if (delOverlay.classList.contains('open')) return; // déjà ouvert : on ne refait rien
  if (session) endSession('tap');                    // jamais de micro actif pendant la suppression
  delTarget = note;
  $('delPreview').textContent = '« ' + note.text + ' »';
  delOverlay.classList.add('open');
  // L'instruction vocale n'est dite qu'à la toute première utilisation,
  // ensuite le visuel suffit.
  if (!localStorage.getItem('mv_del_hint_done')) {
    localStorage.setItem('mv_del_hint_done', '1');
    speak('Garde le doigt appuyé sur le bouton rouge pour supprimer.');
  }
}
function closeDelete() {
  delOverlay.classList.remove('open');
  holdDel.classList.remove('holding');
  clearTimeout(holdTimer);
  delTarget = null;
}
function holdStart(e) {
  e.preventDefault();
  holdDel.classList.add('holding');
  holdTimer = setTimeout(() => {
    if (delTarget) {
      deleteNote(delTarget.id);
      speak('Note supprimée.');
    }
    closeDelete();
  }, 3000);
}
function holdStop() {
  holdDel.classList.remove('holding');
  clearTimeout(holdTimer);
}
holdDel.addEventListener('pointerdown', holdStart);
holdDel.addEventListener('pointerup', holdStop);
holdDel.addEventListener('pointerleave', holdStop);
holdDel.addEventListener('pointercancel', holdStop);
cancelDel.onclick = closeDelete;

/* ---------- Lecture longue (file de phrases, fiable sur Android) ---------- */
function speakLong(parts, onDone) {
  pauseRecognition();
  const myId = ++speakSeq;
  speakingText = null;
  speechSynthesis.cancel();
  let i = 0;
  function next() {
    if (myId !== speakSeq) return;           // une autre voix a pris la main
    if (i >= parts.length) {
      if (onDone) onDone();
      resumeRecognitionIfSession();
      return;
    }
    const u = new SpeechSynthesisUtterance(parts[i++]);
    u.lang = 'fr-FR';
    if (frVoice) u.voice = frVoice;
    u.rate = 0.95;
    u.onend = u.onerror = next;
    speechSynthesis.speak(u);
  }
  next();
}

/* ---------- Ma journée : relire toutes les notes du jour ---------- */
function readToday() {
  if (session) endSession('tap');
  const today = dayLabel(Date.now());
  const notes = loadNotes().filter(n => dayLabel(n.ts) === today).reverse(); // chrono
  if (!notes.length) {
    speak('Tu n\u2019as rien noté aujourd\u2019hui.');
    return;
  }
  const parts = [];
  parts.push(notes.length === 1
    ? 'Aujourd\u2019hui, tu as noté une chose.'
    : 'Aujourd\u2019hui, tu as noté ' + notes.length + ' choses.');
  for (const n of notes) parts.push('À ' + spokenTime(n.ts) + ' : ' + n.text + '.');
  parts.push('C\u2019est tout pour aujourd\u2019hui.');
  speakLong(parts);
}

/* ---------- Recherche vocale : "quel mot ?" → filtre + lecture ---------- */
let searching = false;

function startSearch() {
  if (searching || !SR) return;
  if (session) endSession('tap');
  searching = true;
  statusEl.textContent = 'Recherche : dis le mot à chercher.';
  speak('Quel mot veux-tu chercher ?', () => {
    const r = new SR();
    r.lang = 'fr-FR';
    r.continuous = false;
    r.interimResults = false;
    const stopSearch = () => { searching = false; };
    const timeout = setTimeout(() => { try { r.stop(); } catch (e) {} }, 8000);
    r.onresult = e => {
      clearTimeout(timeout);
      const word = (e.results[0][0].transcript || '').trim().toLowerCase();
      if (word) runSearch(word);
      else speak('Je n\u2019ai pas entendu de mot.');
      stopSearch();
    };
    r.onerror = () => {
      clearTimeout(timeout);
      speak('Je n\u2019ai pas entendu. Réessaie avec le bouton Chercher.');
      stopSearch();
    };
    r.onend = stopSearch;
    try { r.start(); } catch (e) { console.error(e); stopSearch(); }
  });
}

function runSearch(word) {
  activeFilter = word;
  renderNotes();
  $('filterLabel').textContent = 'Résultats pour «\u00A0' + word + '\u00A0»';
  $('filterBar').classList.add('on');
  const hits = loadNotes().filter(n => n.text.toLowerCase().includes(word));
  if (!hits.length) {
    speak('Aucune note avec le mot ' + word + '.');
    return;
  }
  const parts = [];
  parts.push(hits.length === 1
    ? 'J\u2019ai trouvé une note avec le mot ' + word + '.'
    : 'J\u2019ai trouvé ' + hits.length + ' notes avec le mot ' + word + '.');
  const toRead = hits.slice(0, 5);
  for (const n of toRead) parts.push(fmtWhen(n.ts) + ' : ' + n.text + '.');
  if (hits.length > 5) parts.push('Les autres sont affichées à l\u2019écran.');
  speakLong(parts);
}

function clearFilter() {
  activeFilter = null;
  $('filterBar').classList.remove('on');
  renderNotes();
}

$('todayBtn').onclick = readToday;
$('searchBtn').onclick = startSearch;
$('clearFilter').onclick = clearFilter;

/* ---------- Horloge (repère temporel permanent) ---------- */
function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
}
tick(); setInterval(tick, 15000);

/* ---------- Init ---------- */
renderNotes();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.error(e));
}

/* ---------- Auto-démarrage vocal à l'ouverture ----------
   « Ok Google, ouvre Memory » → l'app s'ouvre → la session démarre seule.
   Uniquement si le micro est déjà autorisé en permanence (sinon Chrome
   bloquerait de toute façon : le tap reste le plan B). */
(async () => {
  if (!SR) return;
  try {
    if (!navigator.permissions) return;
    const st = await navigator.permissions.query({ name: 'microphone' });
    if (st.state === 'granted') {
      setTimeout(() => { if (!session) startSession(); }, 600);
    }
  } catch (e) { console.error(e); }
})();
</script>
