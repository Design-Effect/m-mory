<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FCF6F9">
<title>Mémory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FCF6F9;
    --ink: #3A2E4F;
    --ink-soft: #7A6E8F;
    --amber: #6F5BA8;
    --amber-deep: #57468A;
    --listen-bg: #FFD84D;
    --listen-ink: #4A3600;
    --card: #FFFFFF;
    --card-border: #EBD9E6;
    --danger: #C1121F;
    --ok: #2D6A4F;
    --radius: 28px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    background: var(--paper);
    background-image: radial-gradient(circle at 20% 0%, #F3E8F6 0%, transparent 55%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    transition: background-color .35s ease;
  }
  body.listening {
    background: var(--listen-bg);
    background-image: none;
    color: var(--listen-ink);
  }

  header {
    width: 100%;
    max-width: 640px;
    padding: 20px 22px 4px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #clock {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  body.listening #clock { color: var(--listen-ink); }

  main {
    width: 100%;
    max-width: 640px;
    padding: 10px 18px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  /* ---------- GROS BOUTON ---------- */
  #bigBtn {
    width: min(78vw, 320px);
    height: min(78vw, 320px);
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #8A79C9, var(--amber) 60%, var(--amber-deep));
    color: #fff;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    box-shadow: 0 14px 40px rgba(87, 70, 138, .35), inset 0 -6px 14px rgba(0,0,0,.18);
    margin: 22px 0 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    touch-action: manipulation;
    user-select: none;
    transition: transform .1s ease;
  }
  #bigBtn:active { transform: scale(.96); }
  #bigBtn .mic { font-size: 3.4rem; }

  body.listening #bigBtn {
    background: radial-gradient(circle at 35% 30%, #6B4E00, var(--listen-ink));
    animation: pulse 1.4s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(74, 54, 0, .45);
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74, 54, 0, .45); }
    70%  { box-shadow: 0 0 0 34px rgba(74, 54, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(74, 54, 0, 0); }
  }

  #status {
    min-height: 3.2em;
    font-size: 1.35rem;
    font-weight: 700;
    text-align: center;
    padding: 0 10px;
  }
  #interim {
    min-height: 1.6em;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--ink-soft);
    text-align: center;
    padding: 0 14px;
    max-width: 100%;
    overflow-wrap: break-word;
  }
  body.listening #interim { color: #6B4E00; }

  /* ---------- LISTE DES NOTES ---------- */
  #notesTitle {
    font-family: 'Fraunces', serif;
    font-size: 1.35rem;
    font-weight: 600;
    align-self: flex-start;
    margin: 30px 0 12px;
    border-bottom: 3px solid #E0788F;
    padding-bottom: 4px;
  }
  #notes { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .note {
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px 18px 14px;
    box-shadow: 0 3px 10px rgba(87, 70, 138, .08);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .note .txt {
    font-size: 1.3rem;
    line-height: 1.45;
    overflow-wrap: break-word;
  }
  .note .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .note .when {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .note button {
    border: none;
    border-radius: 18px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 14px 18px;
    cursor: pointer;
    min-height: 54px;
    touch-action: manipulation;
  }
  .note .play {
    flex: 1;
    background: var(--ink);
    color: var(--paper);
  }
  .note .play:active { background: #000; }
  .note .del {
    background: #F6E7E7;
    color: var(--danger);
    min-width: 64px;
  }
  .actions { display: flex; gap: 10px; }

  #empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 1.2rem;
    padding: 26px 10px;
    line-height: 1.5;
  }

  /* ---------- OVERLAY SUPPRESSION ---------- */
  #delOverlay {
    position: fixed;
    inset: 0;
    background: rgba(58, 46, 79, .93);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 26px;
    z-index: 50;
    color: #fff;
    text-align: center;
  }
  #delOverlay.open { display: flex; }
  #delOverlay h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.9rem;
  }
  #delPreview {
    font-size: 1.2rem;
    font-style: italic;
    max-width: 460px;
    max-height: 6em;
    overflow: hidden;
    opacity: .85;
  }
  #holdDel {
    position: relative;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    border: none;
    background: var(--danger);
    color: #fff;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.3;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    overflow: hidden;
  }
  #holdDel .fill {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.28);
    transform: scaleY(0);
    transform-origin: bottom;
  }
  #holdDel.holding .fill {
    transition: transform 3s linear;
    transform: scaleY(1);
  }
  #holdDel span { position: relative; z-index: 1; }
  #cancelDel {
    background: #fff;
    color: var(--ink);
    border: none;
    border-radius: 22px;
    font-family: inherit;
    font-size: 1.4rem;
    font-weight: 700;
    padding: 20px 46px;
    min-height: 66px;
    cursor: pointer;
  }

  #noSupport {
    display: none;
    background: #F6E7E7;
    color: var(--danger);
    border-radius: var(--radius);
    padding: 18px;
    font-size: 1.15rem;
    line-height: 1.5;
    margin-top: 18px;
  }
</style>
</head>
<body>

<header>
  <h1>Mémory</h1>
  <div id="clock"></div>
</header>

<main>
  <button id="bigBtn" aria-label="Démarrer ou arrêter l'enregistrement">
    <span class="mic">🎙️</span>
    <span id="btnLabel">Appuie et parle</span>
  </button>
  <div id="status">Prêt.</div>
  <div id="interim"></div>
  <div id="noSupport">
    Ce navigateur ne gère pas la reconnaissance vocale.<br>
    Ouvre Mémory dans <strong>Google Chrome</strong>.
  </div>

  <div id="notesTitle">Mes notes</div>
  <div id="notes"></div>
  <div id="empty">Aucune note pour l'instant.<br>Appuie sur le gros bouton et parle.</div>
</main>

<div id="delOverlay">
  <h2>Supprimer cette note ?</h2>
  <div id="delPreview"></div>
  <button id="holdDel">
    <div class="fill"></div>
    <span>Maintiens 3 secondes<br>pour supprimer</span>
  </button>
  <button id="cancelDel">Non, je la garde</button>
</div>

<script>
/* =========================================================
   MÉMO VOCAL — v1
   Capture vocale continue + relecture + suppression sécurisée
   Stockage : localStorage (clé mv_notes)
   ========================================================= */

const STORE_KEY = 'mv_notes';
const STOP_PHRASES = ['terminé mémo', 'termine mémo', 'terminé memo', 'fin de note'];
const SILENCE_LIMIT_MS = 30000;

const $ = id => document.getElementById(id);
const bigBtn = $('bigBtn'), btnLabel = $('btnLabel'), statusEl = $('status'),
      interimEl = $('interim'), notesEl = $('notes'), emptyEl = $('empty');

/* ---------- Notes : stockage ---------- */
function loadNotes() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}
function saveNotes(notes) {
  localStorage.setItem(STORE_KEY, JSON.stringify(notes));
}
function addNote(text) {
  const notes = loadNotes();
  notes.unshift({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), text, ts: Date.now() });
  saveNotes(notes);
  renderNotes();
}
function deleteNote(id) {
  saveNotes(loadNotes().filter(n => n.id !== id));
  renderNotes();
}

/* ---------- Affichage ---------- */
function fmtWhen(ts) {
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
  const day0 = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = (day0(now) - day0(d)) / 86400000;
  if (diff === 0) return 'Aujourd\u2019hui à ' + time;
  if (diff === 1) return 'Hier à ' + time;
  return d.toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long' }) + ' à ' + time;
}
function renderNotes() {
  const notes = loadNotes();
  emptyEl.style.display = notes.length ? 'none' : 'block';
  notesEl.innerHTML = '';
  for (const n of notes) {
    const card = document.createElement('div');
    card.className = 'note';
    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = n.text;
    const meta = document.createElement('div');
    meta.className = 'when';
    meta.textContent = fmtWhen(n.ts);
    const actions = document.createElement('div');
    actions.className = 'actions';
    const play = document.createElement('button');
    play.className = 'play';
    play.textContent = '🔊 Écouter';
    play.onclick = () => speak(n.text + '. Enregistrée ' + fmtWhen(n.ts) + '.');
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '🗑️';
    del.setAttribute('aria-label', 'Supprimer');
    del.onclick = () => openDelete(n);
    actions.append(play, del);
    card.append(txt, meta, actions);
    notesEl.append(card);
  }
}

/* ---------- Synthèse vocale ---------- */
let frVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('fr'));
  frVoice = vs.find(v => v.lang === 'fr-BE') || vs.find(v => v.lang === 'fr-FR') || vs[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function speak(text, onDone) {
  // On coupe le micro pendant que l'app parle pour ne pas s'auto-transcrire
  pauseRecognition();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  if (frVoice) u.voice = frVoice;
  u.rate = 0.95;
  u.onend = u.onerror = () => {
    if (onDone) onDone();
    resumeRecognitionIfSession();
  };
  speechSynthesis.speak(u);
}

/* ---------- Sons courts (début / fin) ---------- */
function beep(freq, ms) {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms / 1000);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + ms / 1000);
  } catch (e) { console.error(e); }
}

/* ---------- Reconnaissance vocale ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let session = false;        // une session d'écoute est en cours
let recPaused = false;      // micro suspendu pendant le TTS
let silenceTimer = null;
let sessionCount = 0;
let wakeLock = null;

if (!SR) {
  $('noSupport').style.display = 'block';
  bigBtn.disabled = true;
  bigBtn.style.opacity = .4;
}

function resetSilenceTimer() {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(() => endSession('silence'), SILENCE_LIMIT_MS);
}

function containsStop(text) {
  const t = text.toLowerCase();
  return STOP_PHRASES.some(p => t.includes(p));
}
function stripStop(text) {
  let t = text;
  for (const p of STOP_PHRASES) {
    const i = t.toLowerCase().indexOf(p);
    if (i !== -1) t = t.slice(0, i);
  }
  return t.trim();
}

function makeRecognizer() {
  const r = new SR();
  r.lang = 'fr-FR';
  r.continuous = true;
  r.interimResults = true;
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      const text = res[0].transcript.trim();
      if (res.isFinal) {
        interimEl.textContent = '';
        if (!text) continue;
        const wantsStop = containsStop(text);
        const clean = stripStop(text);
        if (clean) {
          addNote(clean);
          sessionCount++;
          if (!wantsStop) speak('C\u2019est noté.');
        }
        if (wantsStop) { endSession('voice'); return; }
        resetSilenceTimer();
      } else {
        interim = text;
        resetSilenceTimer();
      }
    }
    if (interim) interimEl.textContent = '« ' + interim + ' »';
  };
  r.onend = () => {
    // Chrome coupe la reco régulièrement : on relance tant que la session est active
    if (session && !recPaused) {
      try { r.start(); } catch (e) { console.error(e); }
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      endSession('error');
      statusEl.textContent = 'Micro refusé. Autorise le micro dans Chrome.';
    }
  };
  return r;
}

function pauseRecognition() {
  if (rec && session) {
    recPaused = true;
    try { rec.stop(); } catch (e) {}
  }
}
function resumeRecognitionIfSession() {
  if (session && recPaused) {
    recPaused = false;
    try { rec.start(); } catch (e) {}
  }
}

async function startSession() {
  session = true;
  sessionCount = 0;
  recPaused = false;
  document.body.classList.add('listening');
  btnLabel.textContent = 'J\u2019écoute…\n(appuie pour arrêter)';
  statusEl.textContent = 'Parle, je note tout. Dis « terminé mémo » pour arrêter.';
  beep(880, 150);
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { console.error(e); }
  rec = makeRecognizer();
  speak('Je t\u2019écoute.', () => resetSilenceTimer());
}

function endSession(reason) {
  if (!session) return;
  session = false;
  clearTimeout(silenceTimer);
  recPaused = false;
  if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  document.body.classList.remove('listening');
  btnLabel.textContent = 'Appuie et parle';
  interimEl.textContent = '';
  beep(440, 200);
  const msg = sessionCount === 0
    ? 'Session terminée. Aucune note.'
    : sessionCount === 1
      ? 'Session terminée. Une note enregistrée.'
      : 'Session terminée. ' + sessionCount + ' notes enregistrées.';
  statusEl.textContent = msg;
  if (reason !== 'error') {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(msg);
    u.lang = 'fr-FR';
    if (frVoice) u.voice = frVoice;
    speechSynthesis.speak(u);
  }
}

bigBtn.onclick = () => {
  if (!SR) return;
  session ? endSession('tap') : startSession();
};

/* ---------- Suppression sécurisée (maintien 3 s) ---------- */
const delOverlay = $('delOverlay'), holdDel = $('holdDel'), cancelDel = $('cancelDel');
let delTarget = null, holdTimer = null;

function openDelete(note) {
  delTarget = note;
  $('delPreview').textContent = '« ' + note.text + ' »';
  delOverlay.classList.add('open');
  speak('Pour supprimer, garde le doigt appuyé sur le bouton rouge pendant trois secondes.');
}
function closeDelete() {
  delOverlay.classList.remove('open');
  holdDel.classList.remove('holding');
  clearTimeout(holdTimer);
  delTarget = null;
}
function holdStart(e) {
  e.preventDefault();
  holdDel.classList.add('holding');
  holdTimer = setTimeout(() => {
    if (delTarget) {
      deleteNote(delTarget.id);
      speak('Note supprimée.');
    }
    closeDelete();
  }, 3000);
}
function holdStop() {
  holdDel.classList.remove('holding');
  clearTimeout(holdTimer);
}
holdDel.addEventListener('pointerdown', holdStart);
holdDel.addEventListener('pointerup', holdStop);
holdDel.addEventListener('pointerleave', holdStop);
holdDel.addEventListener('pointercancel', holdStop);
cancelDel.onclick = closeDelete;

/* ---------- Horloge (repère temporel permanent) ---------- */
function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
}
tick(); setInterval(tick, 15000);

/* ---------- Init ---------- */
renderNotes();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.error(e));
}
</script>
</body>
</html>
